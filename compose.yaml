name: infra

include:
  - stacks/whoami/compose.yaml
  - stacks/postgres-lite/compose.yaml
  - stacks/portal/compose.yaml

networks:
  proxy: {}
  internal:
    internal: true

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.6
    profiles: ["lite", "lab"]
    restart: unless-stopped
    command: --configFile=/etc/traefik/traefik.yml
    ports:
      # Localhost only — NEVER 0.0.0.0 (public access only via cloudflared)
      - "127.0.0.1:80:80"
      - "127.0.0.1:8080:8080"
      # Access from other devices via Tailscale (optional, uncomment if needed):
      # - "100.118.233.127:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro # mkcert later (*.lan)
    networks: [proxy]
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    profiles: ["lite", "lab"]
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    # Default image uid 65532 cannot read the user's 600 secrets → run as the host user
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./secrets/cf-tunnel.yml:/etc/cloudflared/config.yml:ro
    # Old tunnel ingress uses localhost:PORT — inside the container that is not the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [proxy]
    depends_on: [traefik]
    mem_limit: 192m
    cpus: 0.25
    logging: *default-logging
    # No healthcheck: distroless image (no sh/wget/curl).
    # Monitoring: `./mode status` + Cloudflare Zero Trust → Tunnels.

  # Strict privacy: only the `traefik` entrypoint (127.0.0.1:8080) — never enters the tunnel.
  # docker.sock justification (root-equivalent): lab-only log viewer, off in desktop/lite modes.
  dozzle:
    image: amir20/dozzle:v11.1.2
    profiles: ["lab"]
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`dozzle.lan`)"
      - "traefik.http.routers.dozzle.entrypoints=traefik"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging
    # No healthcheck: distroless image (no sh/wget/curl).
