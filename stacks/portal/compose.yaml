services:
  portal:
    build: .
    profiles: ["lite", "lab"]
    restart: unless-stopped
    env_file:
      - ../../secrets/cf-api-token.env
    environment:
      INFRA_ROOT: /infra
      PORTAL_LISTEN: ":3000"
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-example.com}
      CF_ZONE_ID: 8cf06808d24156dea817bea46e26a573
      CF_ACCOUNT_ID: 704cdc3baf4cd34018a536e0a560f830
      CF_TUNNEL_ID: 44703f6e-2691-4677-8fe0-57245730f516
      TRAEFIK_API: http://traefik:8080
      PUBLIC_ORIGIN: http://traefik:80
      # Ganti ke IP LAN (mis. http://192.168.1.5:80) bila connector tunnel
      # pindah ke device lain: nama "traefik" tidak resolve di luar host ini.
      PORTAL_ACCESS_EMAIL: hanifdwyputrasembiring@gmail.com
    volumes:
      - ../..:/infra
      - /var/run/docker.sock:/var/run/docker.sock
    # Hanya bootstrap lokal. Publik lewat CF Access setelah token di-rotate,
    # jadi hostname portal BELUM didaftarkan ke ingress tunnel.
    ports:
      - "127.0.0.1:8300:3000"
    networks: [proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portal.rule=Host(`portal.${PUBLIC_DOMAIN:-example.com}`)"
      - "traefik.http.routers.portal.entrypoints=web"
      - "traefik.http.services.portal.loadbalancer.server.port=3000"
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
