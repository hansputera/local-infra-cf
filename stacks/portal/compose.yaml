services:
  portal:
    build: .
    profiles: ["lite", "lab"]
    restart: unless-stopped
    env_file:
      - ../../secrets/cf-api-token.env
    environment:
      INFRA_ROOT: /infra
      PORTAL_LISTEN: ":3000"
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-example.com}
      # From .env (gitignored) — never hardcode account/zone/tunnel ids here.
      CF_ZONE_ID: ${CF_ZONE_ID:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_TUNNEL_ID: ${CF_TUNNEL_ID:-}
      TRAEFIK_API: http://traefik:8080
      PUBLIC_ORIGIN: http://traefik:80
      # Change to a LAN IP (e.g. http://192.168.1.5:80) if the tunnel connector
      # moves to another device: the name "traefik" does not resolve outside this host.
      PORTAL_ACCESS_EMAIL: ${PORTAL_ACCESS_EMAIL:-}
    volumes:
      - ../..:/infra
      - /var/run/docker.sock:/var/run/docker.sock
    # Local bootstrap only. Public access goes through CF Access after the token is rotated,
    # so the portal hostname is NOT yet registered in the tunnel ingress.
    ports:
      - "127.0.0.1:8300:3000"
    networks: [proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portal.rule=Host(`portal.${PUBLIC_DOMAIN:-example.com}`)"
      - "traefik.http.routers.portal.entrypoints=web"
      - "traefik.http.services.portal.loadbalancer.server.port=3000"
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
