x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PUBLIC PATTERN: Host() must match the hostname in Cloudflare Tunnel.
  # Publicly reached via cloudflared -> http://traefik:80 -> this router.
  whoami:
    image: mendhak/http-https-echo:42
    profiles: ["lite", "lab"]
    restart: unless-stopped
    networks: [proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.${PUBLIC_DOMAIN:-example.com}`)"
      - "traefik.http.routers.whoami.entrypoints=web"
      - "traefik.http.services.whoami.loadbalancer.server.port=8080"
      # PRIVATE PATTERN (example, uncomment to use):
      #   localhost/Tailscale only — *.lan host rule, NOT registered in the CF tunnel.
      #   - "traefik.http.routers.whoami-lan.rule=Host(`whoami.lan`)"
      #   - "traefik.http.routers.whoami-lan.entrypoints=web"
      #   access: curl -H 'Host: whoami.lan' http://127.0.0.1  (or via the Tailscale IP)
    mem_limit: 128m # idle node ~38MB, 64m too tight for a spike
    cpus: 0.1
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
