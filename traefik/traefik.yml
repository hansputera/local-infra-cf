# Traefik v3 — static config
entryPoints:
  web:
    address: ":80" # opened to cloudflared (network proxy) + 127.0.0.1 for local testing
  traefik:
    address: ":8080" # dashboard + PRIVATE service (127.0.0.1 only)

api:
  dashboard: true
  insecure: false # dashboard via router api@internal in dynamic/dashboard.yml

ping: {} # healthcheck: http://127.0.0.1:8080/ping

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO
  format: json

accessLog: {}
